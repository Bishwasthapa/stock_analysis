<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nepal Pattern Strategy Hub</title>
    <meta name="description" content="Premium technical analysis dashboard for Nepal Stock Market patterns and strategies.">
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:        #0d1117;
            --surface:   #161b22;
            --border:    #30363d;
            --muted:     #8b949e;
            --text:      #c9d1d9;
            --white:     #f0f6fc;
            --green:     #00e676;
            --red:       #ef5350;
            --orange:    #ffa726;
            --blue:      #29b6f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ── Sidebar ── */
        aside {
            width: 280px;
            min-width: 280px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px 16px;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
            font-weight: 800;
            color: var(--white);
            letter-spacing: 0.06em;
        }

        .logo-icon {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, var(--blue), #0288d1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        /* Symbol Search */
        .field-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 6px;
        }

        .search-wrap {
            position: relative;
        }

        .search-wrap svg {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            width: 16px; height: 16px;
        }

        input#symbolInput {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px 10px 34px;
            color: var(--white);
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        input#symbolInput:focus { border-color: var(--blue); }
        input#symbolInput::placeholder { color: var(--muted); }

        /* Data Toggle */
        .toggle-row {
            display: flex;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 3px;
            gap: 3px;
        }

        .toggle-btn {
            flex: 1;
            padding: 7px 0;
            border: none;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            background: transparent;
            color: var(--muted);
            transition: all 0.2s;
            font-family: inherit;
        }

        .toggle-btn.active {
            background: var(--blue);
            color: #fff;
        }

        /* Years slider */
        .years-track {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--muted);
            margin-top: 6px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--blue);
            cursor: pointer;
        }

        /* Action buttons */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.18s;
            text-align: left;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--blue), #0288d1);
            color: white;
            border: none;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(41,182,246,0.35); }

        .btn-green  { color: var(--green);  background: rgba(0,230,118,.06);  border-color: rgba(0,230,118,.2); }
        .btn-green:hover  { background: rgba(0,230,118,.14); }
        .btn-green.ema-on { background: rgba(0,230,118,.18); border-color: var(--green); }

        .btn-orange { color: var(--orange); background: rgba(255,167,38,.06); border-color: rgba(255,167,38,.2); }
        .btn-orange:hover { background: rgba(255,167,38,.14); }

        /* Sidebar footer */
        .sidebar-footer {
            margin-top: auto;
            font-size: 0.75rem;
            color: var(--muted);
            border-top: 1px solid var(--border);
            padding-top: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ── Main ── */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px 24px;
            min-width: 0;
        }

        /* Header */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .stock-name { font-size: 1.2rem; font-weight: 700; color: var(--white); }
        .stock-meta { display: flex; align-items: center; gap: 10px; margin-top: 3px; }
        .price-val  { font-size: 1.05rem; font-weight: 700; }
        .price-chg  { font-size: 0.8rem; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
        .price-chg.up   { background: rgba(0,230,118,.12); color: var(--green); }
        .price-chg.down { background: rgba(239,83,80,.12);  color: var(--red); }

        /* Stat pills */
        .stat-pills  { display: flex; gap: 10px; }
        .stat-pill   {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 16px;
            text-align: center;
            min-width: 90px;
        }
        .stat-lbl { font-size: 0.6rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
        .stat-val { font-size: 1rem; font-weight: 800; margin-top: 2px; }

        /* Chart */
        #chart-wrap {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        #tv-chart { width: 100%; height: 100%; }

        /* Loading spinner */
        #loading {
            position: absolute;
            inset: 0;
            background: rgba(13,17,23,.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
            border-radius: 12px;
        }
        .spinner {
            width: 36px; height: 36px;
            border: 3px solid rgba(41,182,246,.15);
            border-top-color: var(--blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Pattern badge */
        #pattern-badge {
            position: absolute;
            top: 16px; right: 16px;
            background: rgba(22,27,34,.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 10px;
            padding: 12px 16px;
            display: none;
            z-index: 10;
            min-width: 190px;
        }
        .badge-title { font-size: 1rem; font-weight: 800; letter-spacing: 0.04em; }
        .badge-sub   { font-size: 0.75rem; color: var(--muted); margin-top: 3px; }

        /* Bottom info bar */
        .info-bar {
            display: flex;
            gap: 14px;
            margin-top: 14px;
        }

        .info-card {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
        }
        .info-card .card-label { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }
        .info-card .card-value { font-size: 1rem; font-weight: 700; color: var(--white); margin-top: 4px; }
        .info-card .card-sub   { font-size: 0.75rem; margin-top: 2px; }

        /* Report Modal */
        #report-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.6);
            backdrop-filter: blur(4px);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            width: 100%;
            max-width: 860px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 28px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-title { font-size: 1.1rem; font-weight: 700; color: var(--white); }
        .close-btn {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--muted);
            border-radius: 6px;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-family: inherit;
        }

        /* Report Table */
        .report-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
        }
        .report-table th {
            text-align: left;
            padding: 8px 12px;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.68rem;
            letter-spacing: 0.06em;
        }
        .report-table td {
            padding: 8px 12px;
            border-bottom: 1px solid rgba(48,54,61,.5);
        }
        .report-table tr:hover td { background: rgba(255,255,255,.03); }

        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.75rem;
        }
        .tag-in-up    { background: rgba(0,230,118,.12); color: var(--green); }
        .tag-in-down  { background: rgba(41,182,246,.12); color: var(--blue); }
        .tag-out-up   { background: rgba(255,167,38,.12); color: var(--orange); }
        .tag-out-down { background: rgba(239,83,80,.12);  color: var(--red); }

        .report-empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 0.9rem; }

        /* Toast */
        #toast {
            position: fixed;
            bottom: 28px;
            right: 28px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 18px;
            font-size: 0.85rem;
            color: var(--text);
            opacity: 0;
            transition: opacity 0.25s;
            z-index: 300;
            pointer-events: none;
        }
        #toast.show { opacity: 1; }
    </style>
</head>
<body>

<!-- ═══════════════ SIDEBAR ═══════════════ -->
<aside>
    <div class="logo">
        <div class="logo-icon">📈</div>
        ALPHA STRATEGY
    </div>

    <!-- Symbol search -->
    <div>
        <div class="field-label">Symbol</div>
        <div class="search-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input type="text" id="symbolInput" placeholder="NICA, SCB, SHEL…" value="SCB">
        </div>
    </div>

    <!-- Adjusted / Unadjusted -->
    <div>
        <div class="field-label">Price Type</div>
        <div class="toggle-row">
            <button class="toggle-btn active" id="btn-adj"   onclick="setPriceType('adjusted')">Adjusted</button>
            <button class="toggle-btn"          id="btn-unadj" onclick="setPriceType('unadjusted')">Unadjusted</button>
        </div>
    </div>

    <!-- History Range -->
    <div>
        <div class="field-label">History — <span id="yearsLabel">5 Years</span></div>
        <input type="range" id="yearsRange" min="1" max="15" value="5">
        <div class="years-track"><span>1Y</span><span>5Y</span><span>10Y</span><span>Max</span></div>
    </div>

    <!-- Action buttons -->
    <div class="btn-group">
        <button class="action-btn btn-primary" id="btn-fetch" onclick="runAnalysis()">
            ▶ &nbsp;Full Analysis
        </button>
        <button class="action-btn btn-green" id="btn-ema" onclick="toggleEMA()">
            〰 &nbsp;Toggle EMA  <span id="ema-badge" style="margin-left:auto;font-size:.7rem;opacity:.7"></span>
        </button>
        <button class="action-btn btn-orange" onclick="openReport()">
            ≡ &nbsp;Strategy Report
        </button>
    </div>

    <div class="sidebar-footer">
        🔄 Auto-fetches fresh data on analysis
    </div>
</aside>

<!-- ═══════════════ MAIN ═══════════════ -->
<main>
    <!-- Header -->
    <div class="top-bar">
        <div>
            <div class="stock-name" id="stockTitle">SCB</div>
            <div class="stock-meta">
                <span class="price-val" id="priceVal">—</span>
                <span class="price-chg" id="priceChg"></span>
            </div>
        </div>
        <div class="stat-pills">
            <div class="stat-pill">
                <div class="stat-lbl">Patterns</div>
                <div class="stat-val" id="patternCount" style="color:var(--blue)">—</div>
            </div>
            <div class="stat-pill">
                <div class="stat-lbl">Bull Crosses</div>
                <div class="stat-val" id="bullCount" style="color:var(--green)">—</div>
            </div>
            <div class="stat-pill">
                <div class="stat-lbl">Bear Crosses</div>
                <div class="stat-val" id="bearCount" style="color:var(--red)">—</div>
            </div>
        </div>
    </div>

    <!-- Chart -->
    <div id="chart-wrap">
        <div id="tv-chart"></div>
        <div id="loading"><div class="spinner"></div></div>
        <div id="pattern-badge">
            <div class="badge-title" id="badge-label"></div>
            <div class="badge-sub"   id="badge-sub"></div>
        </div>
    </div>

    <!-- Info bar -->
    <div class="info-bar">
        <div class="info-card">
            <div class="card-label">Latest Signal</div>
            <div class="card-value" id="card-signal">—</div>
            <div class="card-sub"   id="card-signal-date" style="color:var(--muted)"></div>
        </div>
        <div class="info-card">
            <div class="card-label">Price at Signal</div>
            <div class="card-value" id="card-price">—</div>
            <div class="card-sub"   id="card-price-type" style="color:var(--muted)"></div>
        </div>
        <div class="info-card">
            <div class="card-label">Data Status</div>
            <div class="card-value" id="card-rows">—</div>
            <div class="card-sub"   id="card-data-range" style="color:var(--muted)"></div>
        </div>
    </div>
</main>

<!-- ═══════════════ REPORT MODAL ═══════════════ -->
<div id="report-modal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title">📊 Strategy Report — <span id="modal-sym"></span></div>
            <button class="close-btn" onclick="closeReport()">✕</button>
        </div>
        <div id="modal-forecast"></div>
        <div id="modal-table"></div>
    </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ══════════════════════════════════
// Chart setup
// ══════════════════════════════════
const wrap  = document.getElementById('tv-chart');
const chart = LightweightCharts.createChart(wrap, {
    layout:  { background: { color: '#161b22' }, textColor: '#c9d1d9' },
    grid:    { vertLines: { color: 'rgba(255,255,255,0.04)' }, horzLines: { color: 'rgba(255,255,255,0.04)' } },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor: '#30363d' },
    timeScale: { borderColor: '#30363d', timeVisible: true },
    handleScroll: true,
    handleScale:  true,
});

const candleSeries = chart.addCandlestickSeries({
    upColor: '#00e676', downColor: '#ef5350',
    borderUpColor: '#00e676', borderDownColor: '#ef5350',
    wickUpColor: '#00e676',   wickDownColor: '#ef5350',
});

let emaShortSeries = null;
let emaLongSeries  = null;
let emaVisible = false;
let currentSymbol = 'SCB';
let currentYears  = 5;

// Resize chart to fill container
function resizeChart() {
    const w = document.getElementById('chart-wrap').clientWidth;
    const h = document.getElementById('chart-wrap').clientHeight;
    chart.resize(w, h);
}
window.addEventListener('resize', resizeChart);
setTimeout(resizeChart, 100);

// ══════════════════════════════════
// API helpers
// ══════════════════════════════════
function showLoading(v) { document.getElementById('loading').style.display = v ? 'flex' : 'none'; }
function toast(msg, dur = 3000) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), dur);
}

// Price type (for UI only—backend always returns adjusted; future: pass param)
let priceType = 'adjusted';
function setPriceType(t) {
    priceType = t;
    document.getElementById('btn-adj').classList.toggle('active', t === 'adjusted');
    document.getElementById('btn-unadj').classList.toggle('active', t === 'unadjusted');
    toast(`Price type set to ${t}. Re-run analysis to refresh.`);
}

// Years slider
document.getElementById('yearsRange').addEventListener('input', (e) => {
    const v = parseInt(e.target.value);
    document.getElementById('yearsLabel').textContent = v === 15 ? 'All' : `${v} Year${v > 1 ? 's' : ''}`;
    currentYears = v;
});

// Enter key on symbol input
document.getElementById('symbolInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') runAnalysis();
});

// ══════════════════════════════════
// Run Analysis
// ══════════════════════════════════
async function runAnalysis() {
    const sym   = document.getElementById('symbolInput').value.trim().toUpperCase();
    const years = document.getElementById('yearsRange').value;
    if (!sym) return;

    currentSymbol = sym;
    currentYears  = parseInt(years);
    showLoading(true);
    document.getElementById('stockTitle').textContent = sym;
    document.getElementById('pattern-badge').style.display = 'none';

    try {
        // 1. Fetch OHLCV
        const dataRes  = await fetch(`/api/stocks/${sym}?years=${years}`);
        if (!dataRes.ok) throw new Error(`Symbol "${sym}" not found. Fetch fresh data first.`);
        const ohlcv = await dataRes.json();

        const candles = ohlcv.map(d => ({
            time: d.Date, open: d.Open, high: d.High, low: d.Low, close: d.Close
        }));
        candleSeries.setData(candles);

        // Price header
        const last = ohlcv[ohlcv.length - 1];
        const prev = ohlcv[ohlcv.length - 2];
        if (last && prev) {
            const chg = ((last.Close - prev.Close) / prev.Close * 100).toFixed(2);
            document.getElementById('priceVal').textContent = `Rs. ${last.Close.toFixed(1)}`;
            const chgEl = document.getElementById('priceChg');
            chgEl.textContent = `${chg > 0 ? '+' : ''}${chg}%`;
            chgEl.className = `price-chg ${chg >= 0 ? 'up' : 'down'}`;
        }

        document.getElementById('card-rows').textContent = `${ohlcv.length} rows`;
        document.getElementById('card-data-range').textContent =
            `${ohlcv[0].Date} → ${ohlcv[ohlcv.length-1].Date}`;

        // 2. Fetch patterns
        const pRes     = await fetch(`/api/stocks/${sym}/patterns?years=${years}`);
        const patterns = await pRes.json();

        const markers = patterns.map(p => ({
            time: p.date,
            position: p.type === 'high' ? 'aboveBar' : 'belowBar',
            color:  p.cross_type === 'bull' ? '#00e676' : (p.cross_type === 'bear' ? '#ef5350' : '#ffa726'),
            shape:  p.type === 'high' ? 'arrowDown' : 'arrowUp',
            text:   p.cross_type.toUpperCase(),
        }));
        candleSeries.setMarkers(markers);

        // Pattern counts
        const bullPats = patterns.filter(p => p.cross_type === 'bull').length;
        const bearPats = patterns.filter(p => p.cross_type === 'bear').length;
        document.getElementById('patternCount').textContent = patterns.length;
        document.getElementById('bullCount').textContent    = bullPats;
        document.getElementById('bearCount').textContent    = bearPats;

        // Latest pattern badge
        if (patterns.length > 0) {
            const last = patterns[patterns.length - 1];
            const isHigh = last.type === 'high';
            const badge = document.getElementById('pattern-badge');
            document.getElementById('badge-label').textContent = isHigh ? '⬆ STRUCTURAL HIGH' : '⬇ STRUCTURAL LOW';
            document.getElementById('badge-label').style.color = isHigh ? 'var(--green)' : 'var(--orange)';
            document.getElementById('badge-sub').textContent   = `Last signal: ${last.date}`;
            badge.style.display = 'block';
        }

        // Signal cards
        if (patterns.length > 0) {
            const sig = patterns[patterns.length - 1];
            document.getElementById('card-signal').textContent = sig.cross_type.toUpperCase();
            document.getElementById('card-signal-date').textContent = sig.date;
            document.getElementById('card-price').textContent = `Rs. ${sig.price.toFixed(1)}`;
            document.getElementById('card-price-type').textContent = sig.type.toUpperCase();
        }

        // 3. EMA overlay (if toggled on)
        if (emaVisible) await loadEMA(sym, years);

        chart.timeScale().fitContent();
        toast(`✓ Loaded ${ohlcv.length} bars for ${sym}`);

    } catch (err) {
        toast(`⚠ ${err.message}`);
        console.error(err);
    } finally {
        showLoading(false);
    }
}

// ══════════════════════════════════
// EMA Toggle
// ══════════════════════════════════
async function loadEMA(sym, years) {
    const eRes = await fetch(`/api/stocks/${sym}/ema?years=${years}`);
    if (!eRes.ok) return;
    const ema = await eRes.json();

    if (!emaShortSeries) {
        emaShortSeries = chart.addLineSeries({ color: '#29b6f6', lineWidth: 1.5, title: `${ema.short_span} EMA` });
        emaLongSeries  = chart.addLineSeries({ color: '#ffa726', lineWidth: 1.5, title: `${ema.long_span} EMA`  });
    }
    emaShortSeries.setData(ema.ema_short);
    emaLongSeries.setData(ema.ema_long);
}

function removeEMA() {
    if (emaShortSeries) { chart.removeSeries(emaShortSeries); emaShortSeries = null; }
    if (emaLongSeries)  { chart.removeSeries(emaLongSeries);  emaLongSeries  = null; }
}

async function toggleEMA() {
    emaVisible = !emaVisible;
    const btn  = document.getElementById('btn-ema');
    const badge= document.getElementById('ema-badge');

    if (emaVisible) {
        btn.classList.add('ema-on');
        badge.textContent = '9/18 ON';
        await loadEMA(currentSymbol, currentYears);
        toast('EMA 9/18 enabled');
    } else {
        btn.classList.remove('ema-on');
        badge.textContent = '';
        removeEMA();
        toast('EMA hidden');
    }
}

// ══════════════════════════════════
// Strategy Report Modal
// ══════════════════════════════════
function labelTag(label) {
    const cls = {
        'IN_UP': 'tag-in-up', 'IN_DOWN': 'tag-in-down',
        'OUT_UP': 'tag-out-up', 'OUT_DOWN': 'tag-out-down',
    }[label] || '';
    return `<span class="tag ${cls}">${label}</span>`;
}

async function openReport() {
    const sym   = currentSymbol;
    const years = currentYears;
    document.getElementById('modal-sym').textContent = sym;
    document.getElementById('report-modal').style.display = 'flex';

    const tEl = document.getElementById('modal-table');
    const fEl = document.getElementById('modal-forecast');
    tEl.innerHTML = '<p class="report-empty">Loading…</p>';
    fEl.innerHTML = '';

    try {
        const res  = await fetch(`/api/stocks/${sym}/report?years=${years}`);
        if (!res.ok) {
            tEl.innerHTML = `<p class="report-empty">⚠ No report found for ${sym}.<br>Run a full analysis first to generate the strategy CSV.</p>`;
            return;
        }
        const data = await res.json();

        // Forecast banner
        if (data.forecast && data.forecast.length > 0) {
            const f = data.forecast[0];
            const keys = Object.keys(f);
            fEl.innerHTML = `
                <div style="background:rgba(41,182,246,.07);border:1px solid rgba(41,182,246,.2);border-radius:8px;padding:14px 18px;margin-bottom:18px;">
                    <div style="font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;">Next Signal Forecast</div>
                    <div style="display:flex;gap:24px;flex-wrap:wrap">
                        ${keys.map(k => `<div><span style="color:var(--muted);font-size:.75rem">${k}:</span> <span style="font-weight:700;color:var(--white)">${f[k]}</span></div>`).join('')}
                    </div>
                </div>`;
        }

        // Pattern table
        if (data.pattern_data && data.pattern_data.length > 0) {
            const cols = Object.keys(data.pattern_data[0]);
            tEl.innerHTML = `
                <table class="report-table">
                    <thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead>
                    <tbody>${data.pattern_data.map(row =>
                        `<tr>${cols.map(c => {
                            const v = row[c] ?? '—';
                            const tagged = ['label','pattern','signal','role'].some(k => c.toLowerCase().includes(k))
                                ? labelTag(String(v))
                                : v;
                            return `<td>${tagged}</td>`;
                        }).join('')}</tr>`
                    ).join('')}</tbody>
                </table>`;
        } else {
            tEl.innerHTML = '<p class="report-empty">No pattern data found.</p>';
        }
    } catch (e) {
        tEl.innerHTML = `<p class="report-empty">Error: ${e.message}</p>`;
    }
}

function closeReport() {
    document.getElementById('report-modal').style.display = 'none';
}

// Close modal on backdrop click
document.getElementById('report-modal').addEventListener('click', function(e) {
    if (e.target === this) closeReport();
});

// ══════════════════════════════════
// Init
// ══════════════════════════════════
runAnalysis();
</script>
